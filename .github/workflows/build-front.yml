name: Build front-end MVP

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vercel.json"
      - "data/candidates/v0.4-rc2/**"
      - ".github/workflows/build-front.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vercel.json"
      - "data/candidates/v0.4-rc2/**"
      - ".github/workflows/build-front.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: ai-sovereignty-front-mvp
          path: dist
          if-no-files-found: error
