name: Validate research data

on:
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate_candidate.py"
      - "scripts/build_rc2_candidate.py"
      - ".github/workflows/validate-research-data.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate_candidate.py"
      - "scripts/build_rc2_candidate.py"
      - ".github/workflows/validate-research-data.yml"

permissions:
  contents: write

jobs:
  validate-v0-4-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v0.4-rc1 source candidate
        run: python scripts/validate_candidate.py data/candidates/v0.4-rc1/manifest.json

      - name: Build v0.4-rc2 candidate
        run: python scripts/build_rc2_candidate.py

      - name: Validate v0.4-rc2 candidate
        run: |
          python scripts/validate_candidate.py \
            data/candidates/v0.4-rc2/manifest.json \
            --output-json build-artifacts/ai-ecosystem-v0.4-rc2.json

      - name: Upload validated v0.4-rc2 canonical dataset
        uses: actions/upload-artifact@v4
        with:
          name: ai-ecosystem-v0.4-rc2-canonical
          path: build-artifacts/ai-ecosystem-v0.4-rc2.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit reproducible v0.4-rc2 candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/v0.4-source-audit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates/v0.4-rc2
          if git diff --cached --quiet; then
            echo "No generated candidate changes to commit."
          else
            git commit -m "Build v0.4-rc2 candidate [skip ci]"
            git push
          fi
