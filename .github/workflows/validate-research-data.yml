name: Validate research data

on:
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate_candidate.py"
      - ".github/workflows/validate-research-data.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate_candidate.py"
      - ".github/workflows/validate-research-data.yml"

permissions:
  contents: read

jobs:
  validate-v0-4-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate candidate archive and graph references
        run: |
          python scripts/validate_candidate.py \
            data/candidates/v0.4-rc1/manifest.json \
            --output-json build-artifacts/ai-ecosystem-v0.4-rc1.json

      - name: Upload validated canonical dataset
        uses: actions/upload-artifact@v4
        with:
          name: ai-ecosystem-v0.4-rc1-canonical
          path: build-artifacts/ai-ecosystem-v0.4-rc1.json
          if-no-files-found: error
          retention-days: 7
